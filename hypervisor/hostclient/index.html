<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VM Alpha Hypervisor</title><link rel="stylesheet" href="style.css"><script src="../base1/cockpit.js"></script><script type="module" src="console.js"></script><script defer src="app.js"></script><script defer src="datastore.js"></script><script defer src="containers.js"></script><script defer src="storage.js"></script><script defer src="monitoring.js"></script></head><body>
<header><div class="brand"><span class="mark">▱</span> VM Alpha <b>Hypervisor</b></div><span class="build">Host Client 1.0</span><button id="account">Connecting…</button><button id="help">Help ▾</button><button id="search-toggle">⌕ Search</button><div id="header-popup" hidden></div></header>
<div class="workspace"><aside><h2>Navigator</h2><nav aria-label="Navigator"><button data-route="host" class="selected">▣ <span>Host</span></button><button data-route="manage" class="child">Manage</button><button data-route="monitor" class="child">Monitor</button><button data-route="vms">▧ <span>Virtual Machines</span><small id="vm-count"></small></button><button data-route="containers" title="VM Alpha Container Platform">▦ <span>Containers</span></button><button data-route="storage" title="VM Alpha Storage">▤ <span>Storage</span><small id="pool-count"></small></button><button data-route="network">⌘ <span>Networking</span><small id="net-count"></small></button></nav><div class="aside-bottom">VM Alpha Linux<br><small>Single-host management</small></div></aside><main id="main"><div class="loading">Connecting to host…</div></main></div>
<section id="tasks" aria-label="Recent tasks"><div class="task-title"><b>Recent tasks</b><input id="task-filter" type="search" aria-label="Filter tasks" placeholder="Filter tasks"><select id="task-status" aria-label="Task result"><option value="">All results</option><option>Completed</option><option>Failed</option></select><button id="refresh-tasks">Refresh</button></div><table><thead><tr><th>Task</th><th>Target</th><th>Initiator</th><th>Queued</th><th>Started</th><th>Result</th><th>Completed</th></tr></thead><tbody id="task-rows"></tbody></table></section><div id="toast" role="status" hidden></div><dialog id="dialog"></dialog>
</body></html>
